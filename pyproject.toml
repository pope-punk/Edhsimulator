[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edh-manual-gauntlet"
version = "1.1.0"
description = "Four-seat agentic EDH gauntlet with deterministic rules and asynchronous planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edh-gauntlet = "edh_gauntlet.campaign:main"
edh-dashboard = "edh_gauntlet.dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edh_gauntlet = ["dashboard_static/*"]

[tool.setuptools.data-files]
"share/edh-gauntlet/data/catalog" = ["data/catalog/cards.json"]
"share/edh-gauntlet/data/decks" = ["data/decks/pod_decklists.json", "data/decks/reaminatour.txt"]
"share/edh-gauntlet/data/reference" = ["data/reference/card_catalog_annotations.json", "data/reference/four_deck_oracle.txt"]
"share/edh-gauntlet/data/strategy" = ["data/strategy/deck_profiles.json", "data/strategy/learning_patch.example.json"]
"share/edh-gauntlet/data/strategy/gameplan_seeds" = ["data/strategy/gameplan_seeds/elenda.md", "data/strategy/gameplan_seeds/minsc_and_boo.md", "data/strategy/gameplan_seeds/omo.md", "data/strategy/gameplan_seeds/reaminatour.md"]
"share/edh-gauntlet/data/strategy/messaging_personalities" = ["data/strategy/messaging_personalities/elenda.md", "data/strategy/messaging_personalities/minsc_and_boo.md", "data/strategy/messaging_personalities/omo.md", "data/strategy/messaging_personalities/reaminatour.md"]
"share/edh-gauntlet/data/strategy/standing_plans" = ["data/strategy/standing_plans/catalog.json", "data/strategy/standing_plans/elenda.md", "data/strategy/standing_plans/minsc_and_boo.md", "data/strategy/standing_plans/omo.md", "data/strategy/standing_plans/reaminatour.md"]
"share/edh-gauntlet/docs" = ["docs/AGENT_ARCHITECTURE_V1.md", "docs/APPROVED_SEQUENCES.md", "docs/CARD_CATALOG_ARCHITECTURE.md", "docs/COMMUNICATIONS.md", "docs/GAUNTLET_WORKFLOW.md", "docs/GITHUB_HANDOFF.md", "docs/HOST_AGENT_POLICY.md", "docs/HOST_RUNTIME.md", "docs/LEARNING.md", "docs/LEGACY_CONTRACTS.md", "docs/MANUAL_REFEREE_PROTOCOL.md", "docs/PILOT_RUNTIME_POLICY.md", "docs/PLANNER_RUNTIME_POLICY.md", "docs/PROJECT_LAYOUT.md", "docs/README.md", "docs/REMOTE_DASHBOARD.md", "docs/RESOURCE_USAGE.md", "docs/RULES_SUPPORT.md", "docs/SPLIT_RUNTIME_POLICY.md", "docs/STATIC_STANDING_PLANS.md", "docs/VALIDATION.md"]
