name: Verify distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m compileall -q src
      - name: Install complete distribution
        run: python -m pip install .
      - name: Verify installed catalog and runtime assets
        working-directory: ${{ runner.temp }}
        run: python -m edh_gauntlet verify
      - name: Run rules primitive conformance checks
        run: python -m unittest discover -s tests -p "test_rules_primitives*.py" -v
